name: Emulator builds

on:
  workflow_call:
    inputs:
      package_version:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux emulator and display test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select package version
        id: version
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: python3 .github/scripts/release_version.py
      - name: Test release tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcsfml-dev libgtk-3-dev xvfb xdotool libgl1-mesa-dri dpkg-dev
      - name: Configure and build the full emulator
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cmake -S . -B build/emulator -DCMAKE_BUILD_TYPE=Release -DDRIVONIX_PACKAGE_VERSION="$PACKAGE_VERSION" -DDRIVONIX_PACKAGE_COMMIT="$GITHUB_SHA" -DDRIVONIX_PACKAGE_BUILD_OS=ubuntu-24.04
          cmake --build build/emulator --parallel 2
      - name: Test console, sound, saves, frontend and pinned dependencies
        run: ctest --test-dir build/emulator --output-on-failure
      - name: Require all 1604000 Z80 cases to pass
        run: python3 UnitTests/conformance/z80.py --fetch --worker build/emulator/z80_worker --report-dir build/z80-report
      - name: Exercise native picker, BIOS, rendering and joypad input
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" python3 UnitTests/frontend/test_linux_gui.py --emulator build/emulator/DrivOnix
          xvfb-run -a -s "-screen 0 1280x1024x24" python3 UnitTests/frontend/test_linux_regions.py --emulator build/emulator/DrivOnix
      - name: Test the installed layout from another working directory
        run: |
          cmake --install build/emulator --prefix build/package
          python3 UnitTests/frontend/test_cli.py --emulator build/package/bin/DrivOnix
      - name: Generate and verify Linux tarball and Debian package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cpack --config build/emulator/CPackConfig.cmake -B build/packages
          python3 .github/scripts/check_packages.py --directory build/packages --platform linux --version "$PACKAGE_VERSION" --commit "$GITHUB_SHA"
      - name: Check console hardware, saves and startup paths with sanitizers
        run: |
          cmake -S . -B build/frontend-sanitized -DCMAKE_BUILD_TYPE=Debug -DDRIVONIX_SANITIZERS=ON
          cmake --build build/frontend-sanitized --parallel 2
          ctest --test-dir build/frontend-sanitized --output-on-failure
      - name: Save verified Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drivonix-packages-linux
          path: |
            build/packages/*.tar.gz
            build/packages/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Save Linux test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drivonix-linux-evidence
          path: |
            build/linux-gui-report/
            build/linux-region-report/
            build/z80-report/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows emulator (MSVC x64)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select package version
        id: version
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: python .github/scripts/release_version.py
      - name: Build pinned native CSFML dependencies
        run: python .github/scripts/build_windows_csfml.py --prefix build/deps
      - name: Configure and build the full emulator
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cmake -S . -B build/emulator -A x64 -DCSFML_ROOT="$env:GITHUB_WORKSPACE/build/deps" -DDRIVONIX_PACKAGE_VERSION="$env:PACKAGE_VERSION" -DDRIVONIX_PACKAGE_COMMIT="$env:GITHUB_SHA" -DDRIVONIX_PACKAGE_BUILD_OS=windows-2022
          cmake --build build/emulator --config Release --parallel 2
          Copy-Item build/deps/bin/*.dll build/emulator/Release/
      - name: Test console, sound, saves, frontend and pinned dependencies
        run: ctest --test-dir build/emulator -C Release --output-on-failure
      - name: Assemble and test the installed layout
        run: |
          cmake --install build/emulator --prefix build/package --config Release
          python UnitTests/frontend/test_cli.py --emulator build/package/bin/DrivOnix.exe
      - name: Generate and verify Windows ZIP package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cpack --config build/emulator/CPackConfig.cmake -C Release -B build/packages
          python .github/scripts/check_packages.py --directory build/packages --platform windows --version "$env:PACKAGE_VERSION" --commit "$env:GITHUB_SHA"
      - name: Save verified Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drivonix-packages-windows
          path: build/packages/*.zip
          if-no-files-found: error
          retention-days: 14
