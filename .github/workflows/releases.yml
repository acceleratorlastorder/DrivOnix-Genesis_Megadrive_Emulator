name: Build, test and release

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version for a preview build (no release is published)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: drivonix-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Select package version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version and source identity
        id: version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/release_version.py

  cpu:
    name: CPU conformance
    needs: version
    uses: ./.github/workflows/cpu-tests.yml

  packages:
    name: Native packages
    needs: version
    uses: ./.github/workflows/emulator-build.yml
    with:
      package_version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, cpu, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified native packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: drivonix-packages-*
          merge-multiple: true
          path: build/release
      - name: Upload complete release with SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/publish_release.py --directory build/release
