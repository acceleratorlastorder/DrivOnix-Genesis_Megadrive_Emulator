; DrivOnix default settings. A writable per-user file is created at startup.
; Run drivonix --print-config-path to locate it, or --portable for a local file.
; Edit settings while the emulator is closed. Values are validated on startup.

[display]
; Integer window scale, 1 through 8. Fullscreen automatically fits the display.
scale=1
fullscreen=false

[audio]
enabled=true
; Host playback volume, 0 through 100. Sound-chip emulation remains active.
volume=100
