; DrivOnix default settings. A writable per-user file is created at startup.
; Run drivonix --print-config-path to locate it, or --portable for a local file.
; Edit while closed, or use the frontend settings screen. Values are validated.

[display]
; Integer window scale, 1 through 8. Fullscreen automatically fits the display.
scale=1
; Fit the game using whole pixels. false retains the explicit scale above.
integer_fit=true
fullscreen=false

[audio]
enabled=true
; Host playback volume, 0 through 100. Sound-chip emulation remains active.
volume=100

[input]
enabled=true
; Stick deadzone percentage (1 through 95).
deadzone=25
; Native controller indices; -1 disables a port. Keyboard controls remain active.
player1=0
player2=1

[interface]
show_bios=false
window_width=1280
window_height=720

[metadata]
; Online information/artwork can be disabled; local games remain available.
online=true

; Add folders from the frontend, or create sections with stable lowercase ids.
; [library.games]
; path="/path/to/games"
; enabled=true
; recursive=true
; Windows paths may use forward slashes, for example "D:/games".

; Bindings are symbolic names, comma-separated alternatives, or "none".
; Escape/F1 and right-stick click open the menu; F11 toggles fullscreen.
; These controls are reserved and cannot be assigned to a game action.
[keyboard.player1]
up="z"
down="s"
left="q"
right="d"
a="k"
b="l"
c="m"
start="a"
x="i"
y="o"
z="p"
mode="enter"

[keyboard.player2]
up="up"
down="down"
left="left"
right="right"
a="numpad1"
b="numpad2"
c="numpad3"
start="numpad4"
x="numpad7"
y="numpad8"
z="numpad9"
mode="numpad0"

[controller.player1]
up="dpad_up,left_y+"
down="dpad_down,left_y-"
left="dpad_left,left_x-"
right="dpad_right,left_x+"
a="x"
b="a"
c="b"
start="start"
x="y"
y="lb"
z="rb"
mode="back"

[controller.player2]
up="dpad_up,left_y+"
down="dpad_down,left_y-"
left="dpad_left,left_x-"
right="dpad_right,left_x+"
a="x"
b="a"
c="b"
start="start"
x="y"
y="lb"
z="rb"
mode="back"
